name: Build e Deploy (Container Infra)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Executar Testes Unitários
        run: mvn test -B

  build-and-deploy:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy na VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/neokioski
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            docker compose pull app
            docker compose up -d --no-build

            # O nginx resolve o IP do 'app' apenas ao iniciar; como o container 'app'
            # é recriado a cada deploy, é preciso recriar o nginx para evitar 502.
            docker compose up -d --force-recreate --no-deps nginx

            echo "Aguardando a aplicação responder (até ~3 min)..."
            for i in $(seq 1 36); do
              code=$(curl -ksS -o /dev/null -w '%{http_code}' \
                --resolve neokioski.online:443:127.0.0.1 \
                https://neokioski.online/ || true)
              if [ "$code" = "200" ] || [ "$code" = "302" ]; then
                echo "Aplicação respondeu HTTP $code. Deploy concluído com sucesso!"
                exit 0
              fi
              echo "Tentativa $i/36: HTTP $code"
              sleep 5
            done

            echo "A aplicação não respondeu a tempo. Logs:"
            docker compose ps
            docker logs --tail 80 neokioski_app
            docker logs --tail 30 neokioski_nginx
            exit 1
