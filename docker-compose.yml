
services:
  app:
    image: ghcr.io/${GITHUB_USER}/${GITHUB_REPO}:latest
    container_name: neokioski_app
    expose:
      - "8080"
    environment:
      - SPRING_DATASOURCE_URL=${DATASOURCE_URL_PROD}
      - SPRING_DATASOURCE_USERNAME=${DATASOURCE_USERNAME_PROD}
      - SPRING_DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD_PROD}
      - APP_PROFILE=prod
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: neokioski_db
    environment:
      - POSTGRES_DB=${DATABASE_NAME_PROD}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - APP_DB_USER=${DATASOURCE_USERNAME_PROD}
      - APP_DB_PASSWORD=${DATASOURCE_PASSWORD_PROD}
      - TZ=America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: neokioski_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: neokioski_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf: