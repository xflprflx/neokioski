server {
    listen 80;
    server_name neokioski.online www.neokioski.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name neokioski.online www.neokioski.online;

    ssl_certificate /etc/letsencrypt/live/neokioski.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neokioski.online/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crítico para Vaadin WebSocket/Push
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}