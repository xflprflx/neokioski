spring:
  datasource:
    url: ${DATASOURCE_URL_TEST}
    username: ${DATASOURCE_USERNAME_TEST}
    password: ${DATASOURCE_PASSWORD_TEST}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    clean-disabled: false
    validate-on-migrate: false
    clean-on-validation-error: false