vaadin:
  launch-browser: true
spring:
  application:
    name: neokioski
  messages:
    encoding: UTF-8
  profiles:
    active: ${APP_PROFILE}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.internal.JCacheRegionFactory
          use_query_cache: true
server:
  forward-headers-strategy: native
